<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WMS Remote</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b1220;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
    .box{text-align:center;max-width:520px;padding:24px}.muted{opacity:.7}a{color:#7db7ff}
  </style>
</head>
<body>
  <div class="box">
    <h2>WMS</h2>
    <p id="status">Шукаю актуальну адресу…</p>
    <p class="muted">Якщо перенаправлення не відбулося автоматично, онови сторінку через кілька секунд.</p>
  </div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const r=await fetch('./remote_url.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    const url=(data.url||'').trim();
    if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i.test(url)) throw new Error('invalid url');
    status.textContent='Перенаправляю на WMS…';
    location.replace(url);
  }catch(e){
    status.innerHTML='Актуальна адреса WMS ще не опублікована. Спробуй оновити сторінку.';
  }
})();
</script>
</body>
</html>
